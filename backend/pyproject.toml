[project]
name = "docpilot-backend"
version = "0.1.0"
description = "DocPilot backend API and clinical memory service"
readme = "README.md"
authors = [
    { name = "AI_Apostle", email = "achasaviourikhamate@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "memwal[openai]>=0.1.11",
    "openai>=3.24.0",
    "openai-agents>=0.23.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "supabase>=2.32.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
